version: v2
clean: true
plugins:
  # protoc-gen-es v2 emits message/enum types AND service descriptors
  # (ServiceDescriptor, consumed by @connectrpc/connect's createClient/createServer).
  - local: protoc-gen-es
    out: src/gen
    opt:
      - target=ts
      - import_extension=.js
      - json_types=true
  - local: protoc-gen-ts_proto
    out: src/dto-gen
    strategy: all
    opt:
      - useReadonlyTypes=true
      - useNullAsOptional=true
      - useExactTypes=false
      - oneof=unions-value
      - exportCommonSymbols=false
      - outputServices=none
      - esModuleInterop=true
      - importSuffix=.js
