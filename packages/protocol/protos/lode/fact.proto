syntax = "proto3";

package lode;

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "lode/edit.proto";
import "lode/model.proto";

enum ContributionMutationKind {
  CONTRIBUTION_MUTATION_KIND_UNSPECIFIED = 0;
  CONTRIBUTION_MUTATION_KIND_NODE_CREATE = 1;
  CONTRIBUTION_MUTATION_KIND_NODE_DELETE = 2;
  CONTRIBUTION_MUTATION_KIND_NODE_RESTORE = 3;
  CONTRIBUTION_MUTATION_KIND_OCCURRENCE_CREATE = 4;
  CONTRIBUTION_MUTATION_KIND_OCCURRENCE_DELETE = 5;
  CONTRIBUTION_MUTATION_KIND_OCCURRENCE_RESTORE = 6;
  CONTRIBUTION_MUTATION_KIND_OCCURRENCE_MOVE = 7;
  CONTRIBUTION_MUTATION_KIND_NODE_OWNER_SET = 8;
  CONTRIBUTION_MUTATION_KIND_DECLARE_INTRINSIC_NODE_TYPE = 9;
  CONTRIBUTION_MUTATION_KIND_SUPERTAG_APPLY = 10;
  CONTRIBUTION_MUTATION_KIND_SUPERTAG_REMOVE = 11;
  CONTRIBUTION_MUTATION_KIND_SUPERTAG_EXTENSION_ADD = 15;
  CONTRIBUTION_MUTATION_KIND_SUPERTAG_EXTENSION_REMOVE = 16;
  CONTRIBUTION_MUTATION_KIND_SUPERTAG_TEMPLATE_NODE_ADD = 17;
  CONTRIBUTION_MUTATION_KIND_SUPERTAG_TEMPLATE_NODE_REMOVE = 18;
  CONTRIBUTION_MUTATION_KIND_TEMPLATE_NODE_DETACH = 19;
  CONTRIBUTION_MUTATION_KIND_FIELD_MATERIALIZE = 20;
  CONTRIBUTION_MUTATION_KIND_FIELD_VALUE_DELETE = 21;
  CONTRIBUTION_MUTATION_KIND_MATERIALIZED_FIELD_DELETE = 22;
  CONTRIBUTION_MUTATION_KIND_TEXT_SPLICE = 24;
  CONTRIBUTION_MUTATION_KIND_TEXT_MARK = 25;
  CONTRIBUTION_MUTATION_KIND_METANODE_ATTACH = 26;
  CONTRIBUTION_MUTATION_KIND_INLINE_REFERENCE_CREATE = 27;
  CONTRIBUTION_MUTATION_KIND_INLINE_REFERENCE_DELETE = 28;
  CONTRIBUTION_MUTATION_KIND_INLINE_REFERENCE_ALIAS_ATTACH = 29;
  CONTRIBUTION_MUTATION_KIND_INLINE_REFERENCE_ALIAS_DETACH = 30;
  CONTRIBUTION_MUTATION_KIND_SEARCH_EXPRESSION_ATTACH = 31;
  CONTRIBUTION_MUTATION_KIND_SEARCH_EXPRESSION_DETACH = 32;
  CONTRIBUTION_MUTATION_KIND_SHARED_DEFAULT_VIEW_DEFINITION_ATTACH = 33;
  CONTRIBUTION_MUTATION_KIND_SHARED_DEFAULT_VIEW_DEFINITION_MODE_SET = 34;
  CONTRIBUTION_MUTATION_KIND_FIELD_DATATYPE_CONFIGURE = 35;
  CONTRIBUTION_MUTATION_KIND_FIELD_CARDINALITY_CONFIGURE = 36;
  CONTRIBUTION_MUTATION_KIND_FIELD_INITIALIZATION_EXPRESSION_CONFIGURE = 37;
  CONTRIBUTION_MUTATION_KIND_SHARED_DEFAULT_VIEW_DEFINITION_DETACH = 38;
  CONTRIBUTION_MUTATION_KIND_SHARED_DEFAULT_VIEW_DEFINITION_SORT_BY_NAME_SET = 39;
  CONTRIBUTION_MUTATION_KIND_SUPERTAG_TEMPLATE_FIELD_ATTACH = 40;
  CONTRIBUTION_MUTATION_KIND_SUPERTAG_TEMPLATE_FIELD_DETACH = 41;
  CONTRIBUTION_MUTATION_KIND_SUPERTAG_TEMPLATE_FIELD_DISCOVERABILITY_SET = 42;
  CONTRIBUTION_MUTATION_KIND_SUPERTAG_OPTIONAL_FIELD_CONTRIBUTION_ATTACH = 43;
  CONTRIBUTION_MUTATION_KIND_SUPERTAG_OPTIONAL_FIELD_CONTRIBUTION_DETACH = 44;
  CONTRIBUTION_MUTATION_KIND_FIELD_OPTIONALITY_CONFIGURE = 45;
  CONTRIBUTION_MUTATION_KIND_SUPERTAG_TEMPLATE_FIELD_EXISTING_ATTACH = 46;
  CONTRIBUTION_MUTATION_KIND_SUPERTAG_TEMPLATE_FIELD_VISIBILITY_CONFIGURE = 47;
  CONTRIBUTION_MUTATION_KIND_SHARED_DEFAULT_VIEW_DEFINITION_OPTIONS_SET = 48;
}

message ContributionNodeCreateMutation {
  string node_id = 1;
  NodeSeed seed = 2;
}

message ContributionNodeRestoreMutation {
  string node_id = 1;
  string deletion_fact_id = 2;
}

message NodeOwnerSetMutation {
  string node_id = 1;
  CurrentNodeOwner owner_node_id = 2;
  PreviousNodeOwner previous_owner_node_id = 3;
}

message CurrentNodeOwner {
  oneof state {
    google.protobuf.Empty detached = 1;
    string owned_by = 2;
  }
}

message PreviousNodeOwner {
  oneof state {
    google.protobuf.Empty unset = 1;
    string set = 2;
  }
}

message MetanodeAttachMutation {
  string host_node_id = 1;
  string metanode_id = 2;
}

message StringValues { repeated string values = 1; }

message DeletedTextAtom {
  string id = 1;
  string value = 2;
  map<string, google.protobuf.Value> attributes = 3;
}

message DeletedTextAtoms { repeated DeletedTextAtom values = 1; }
message JsonAttributes { map<string, google.protobuf.Value> values = 1; }

message ContributionTextSpliceMutation {
  string node_id = 1;
  repeated string delete_atom_ids = 2;
  DeletedTextAtoms deleted_atoms = 3;
  SequenceAnchor anchor = 4;
  string insert = 5;
  JsonAttributes attributes = 6;
}

message ContributionTextMarkMutation {
  string node_id = 1;
  repeated string atom_ids = 2;
  string key = 3;
  PreviousValue value = 4;
  PreviousValue previous = 5;
}

message ContributionInlineReferenceDeleteMutation {
  string inline_reference_id = 1;
  optional string previous_host_node_id = 2;
  optional string previous_target_node_id = 3;
  optional SequenceAnchor previous_anchor = 4;
}

message ContributionFieldDatatypeConfigureMutation {
  string field_definition_id = 1;
  string configuration_node_id = 2;
  string configuration_occurrence_id = 3;
  string datatype_node_id = 4;
  PreviousFieldDatatype previous_datatype_node_id = 5;
  repeated string observed_value_fact_ids = 6;
}

message PreviousFieldDatatype {
  oneof state {
    google.protobuf.Empty unset = 1;
    string set = 2;
  }
}

message ContributionFieldCardinalityConfigureMutation {
  string field_definition_id = 1;
  string configuration_node_id = 2;
  string configuration_occurrence_id = 3;
  string cardinality_node_id = 4;
  PreviousFieldCardinality previous_cardinality_node_id = 5;
  repeated string observed_value_fact_ids = 6;
}

message PreviousFieldCardinality {
  oneof state {
    google.protobuf.Empty unset = 1;
    string set = 2;
  }
}

message ContributionFieldOptionalityConfigureMutation {
  string field_definition_id = 1;
  string configuration_node_id = 2;
  string configuration_occurrence_id = 3;
  string optionality_node_id = 4;
  PreviousFieldOptionality previous_optionality_node_id = 5;
  repeated string observed_value_fact_ids = 6;
}

message SupertagTemplateFieldVisibilityConfigureMutation {
  string supertag_id = 1;
  string template_field_node_id = 2;
  string field_definition_id = 3;
  TemplateFieldVisibility visibility = 4;
  optional TemplateFieldVisibility previous_visibility = 5;
  repeated string observed_visibility_fact_ids = 6;
}

message PreviousFieldOptionality {
  oneof state {
    google.protobuf.Empty unset = 1;
    string set = 2;
  }
}

message ContributionFieldInitializationExpressionConfigureMutation {
  string field_definition_id = 1;
  string configuration_node_id = 2;
  string configuration_occurrence_id = 3;
  FieldInitializationExpression expression = 4;
  PreviousFieldInitializationExpression previous_expression = 5;
  repeated string observed_value_fact_ids = 6;
}

message SearchExpressionDetachMutation {
  string search_node_id = 1;
  string expression_node_id = 2;
  string expression_occurrence_id = 3;
  string definition_occurrence_id = 4;
  SearchExpressionSpec expression = 5;
}

message SharedDefaultViewDefinitionOptionsSetMutation {
  string host_node_id = 1;
  string view_definition_node_id = 2;
  ViewOptionsSpec options = 3;
  optional ViewOptionsSpec previous_options = 4;
  repeated string observed_options_fact_ids = 5;
}

message PreviousFieldInitializationExpression {
  oneof state {
    google.protobuf.Empty unset = 1;
    FieldInitializationExpression set = 2;
  }
}

message ContributionMutation {
  oneof mutation {
    ContributionNodeCreateMutation node_create = 1;
    NodeDeleteMutation node_delete = 2;
    ContributionNodeRestoreMutation node_restore = 3;
    OccurrenceCreateMutation occurrence_create = 4;
    OccurrenceDeleteMutation occurrence_delete = 5;
    OccurrenceRestoreMutation occurrence_restore = 6;
    OccurrenceMoveMutation occurrence_move = 7;
    NodeOwnerSetMutation node_owner_set = 8;
    DeclareIntrinsicNodeTypeMutation declare_intrinsic_node_type = 9;
    SupertagApplyMutation supertag_apply = 10;
    SupertagRemoveMutation supertag_remove = 11;
    SupertagExtensionAddMutation supertag_extension_add = 15;
    SupertagExtensionRemoveMutation supertag_extension_remove = 16;
    SupertagTemplateNodeAddMutation supertag_template_node_add = 17;
    SupertagTemplateNodeRemoveMutation supertag_template_node_remove = 18;
    TemplateNodeDetachMutation template_node_detach = 19;
    FieldMaterializeMutation field_materialize = 20;
    FieldValueDeleteMutation field_value_delete = 21;
    MaterializedFieldDeleteMutation materialized_field_delete = 22;
    ContributionTextSpliceMutation text_splice = 24;
    ContributionTextMarkMutation text_mark = 25;
    MetanodeAttachMutation metanode_attach = 26;
    InlineReferenceCreateMutation inline_reference_create = 27;
    ContributionInlineReferenceDeleteMutation inline_reference_delete = 28;
    InlineReferenceAliasAttachMutation inline_reference_alias_attach = 29;
    InlineReferenceAliasDetachMutation inline_reference_alias_detach = 30;
    SearchExpressionAttachMutation search_expression_attach = 31;
    SearchExpressionDetachMutation search_expression_detach = 32;
    SharedDefaultViewDefinitionAttachMutation shared_default_view_definition_attach = 33;
    SharedDefaultViewDefinitionModeSetMutation shared_default_view_definition_mode_set = 34;
    ContributionFieldDatatypeConfigureMutation field_datatype_configure = 35;
    ContributionFieldCardinalityConfigureMutation field_cardinality_configure = 36;
    ContributionFieldInitializationExpressionConfigureMutation field_initialization_expression_configure = 37;
    SharedDefaultViewDefinitionDetachMutation shared_default_view_definition_detach = 38;
    SharedDefaultViewDefinitionSortByNameSetMutation shared_default_view_definition_sort_by_name_set = 39;
    SupertagTemplateFieldAttachMutation supertag_template_field_attach = 40;
    SupertagTemplateFieldDetachMutation supertag_template_field_detach = 41;
    SupertagTemplateFieldDiscoverabilitySetMutation supertag_template_field_discoverability_set = 42;
    SupertagOptionalFieldContributionAttachMutation supertag_optional_field_contribution_attach = 43;
    SupertagOptionalFieldContributionDetachMutation supertag_optional_field_contribution_detach = 44;
    ContributionFieldOptionalityConfigureMutation field_optionality_configure = 45;
    SupertagTemplateFieldExistingAttachMutation supertag_template_field_existing_attach = 46;
    SupertagTemplateFieldVisibilityConfigureMutation supertag_template_field_visibility_configure = 47;
    SharedDefaultViewDefinitionOptionsSetMutation shared_default_view_definition_options_set = 48;
  }
}
