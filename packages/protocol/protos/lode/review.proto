syntax = "proto3";

package lode;

import "google/protobuf/wrappers.proto";
import "lode/model.proto";

enum FactActionKind {
  FACT_ACTION_KIND_UNSPECIFIED = 0;
  FACT_ACTION_KIND_NODE_CREATE = 1;
  FACT_ACTION_KIND_NODE_TRASH = 2;
  FACT_ACTION_KIND_NODE_RESTORE = 3;
  FACT_ACTION_KIND_PLACEMENT_CREATE = 4;
  FACT_ACTION_KIND_PLACEMENT_REMOVE = 5;
  FACT_ACTION_KIND_WORKSPACE_BOOTSTRAP = 6;
  FACT_ACTION_KIND_PLACEMENT_MOVE = 7;
  FACT_ACTION_KIND_SUPERTAG_APPLICATION_ADD = 8;
  FACT_ACTION_KIND_SUPERTAG_MEMBERSHIP_REMOVE = 9;
  FACT_ACTION_KIND_SUPERTAG_EXTENSION_ADD = 10;
  FACT_ACTION_KIND_SUPERTAG_EXTENSION_REMOVE = 11;
  FACT_ACTION_KIND_TEMPLATE_MEMBER_ADD = 12;
  FACT_ACTION_KIND_TEMPLATE_MEMBER_REMOVE = 13;
  FACT_ACTION_KIND_TEMPLATE_NODE_DETACH = 14;
  FACT_ACTION_KIND_FIELD_MATERIALIZE = 15;
  FACT_ACTION_KIND_FIELD_VALUE_REMOVE = 16;
  FACT_ACTION_KIND_MATERIALIZED_FIELD_CLEAR = 17;
  FACT_ACTION_KIND_RICH_TEXT_SPLICE = 18;
  FACT_ACTION_KIND_RICH_TEXT_MARK = 19;
  FACT_ACTION_KIND_INLINE_REFERENCE_CREATE = 20;
  FACT_ACTION_KIND_INLINE_REFERENCE_REMOVE = 21;
  FACT_ACTION_KIND_INLINE_ALIAS_ATTACH = 22;
  FACT_ACTION_KIND_INLINE_ALIAS_DETACH = 23;
  FACT_ACTION_KIND_SEARCH_EXPRESSION_ADD = 24;
  FACT_ACTION_KIND_SEARCH_EXPRESSION_CONFIGURE = 25;
  FACT_ACTION_KIND_SHARED_DEFAULT_VIEW_ADD = 26;
  FACT_ACTION_KIND_VIEW_MODE_SET = 27;
  FACT_ACTION_KIND_FIELD_CONFIGURATION_SET = 28;
  FACT_ACTION_KIND_SHARED_DEFAULT_VIEW_REMOVE = 29;
  FACT_ACTION_KIND_SHARED_DEFAULT_VIEW_RESTORE = 30;
  FACT_ACTION_KIND_TEMPLATE_FIELD_ADD = 31;
  FACT_ACTION_KIND_TEMPLATE_FIELD_REMOVE = 32;
  FACT_ACTION_KIND_TEMPLATE_FIELD_RESTORE = 33;
  FACT_ACTION_KIND_TEMPLATE_FIELD_VISIBILITY_SET = 34;
  FACT_ACTION_KIND_TEMPLATE_FIELD_STATIC_DEFAULT_SET = 35;
  FACT_ACTION_KIND_OPTIONAL_FIELD_CONTRIBUTION_ADD = 36;
  FACT_ACTION_KIND_OPTIONAL_FIELD_CONTRIBUTION_REMOVE = 37;
  FACT_ACTION_KIND_VIEW_COLUMN_ADD = 38;
  FACT_ACTION_KIND_ORIGINAL_PROMOTE = 39;
  FACT_ACTION_KIND_FIELD_DEFINITION_MAKE_DISCOVERABLE = 40;
  FACT_ACTION_KIND_FIELD_DEFINITION_RETURN_TO_TEMPLATE_FIELD = 41;
  FACT_ACTION_KIND_SEARCH_EXPRESSION_MOVE = 42;
  FACT_ACTION_KIND_SEARCH_EXPRESSION_REMOVE = 43;
  FACT_ACTION_KIND_SEARCH_EXPRESSION_RESTORE = 44;
  FACT_ACTION_KIND_VIEW_COLUMN_REMOVE = 45;
  FACT_ACTION_KIND_VIEW_COLUMN_MOVE = 46;
  FACT_ACTION_KIND_VIEW_SORT_ADD = 47;
  FACT_ACTION_KIND_VIEW_SORT_CONFIGURE = 48;
  FACT_ACTION_KIND_VIEW_SORT_REMOVE = 49;
  FACT_ACTION_KIND_VIEW_SORT_RESTORE = 50;
  FACT_ACTION_KIND_VIEW_GROUP_ADD = 51;
  FACT_ACTION_KIND_VIEW_GROUP_REMOVE = 52;
  FACT_ACTION_KIND_VIEW_FILTER_ADD = 53;
  FACT_ACTION_KIND_VIEW_FILTER_REMOVE = 54;
  FACT_ACTION_KIND_VIEW_FILTER_RESTORE = 55;
}

enum ResolutionDecision {
  RESOLUTION_DECISION_UNSPECIFIED = 0;
  RESOLUTION_DECISION_ACCEPT = 1;
  RESOLUTION_DECISION_REJECT = 2;
}

enum SupertagRelationKind {
  SUPERTAG_RELATION_KIND_UNSPECIFIED = 0;
  SUPERTAG_RELATION_KIND_APPLICATION = 1;
  SUPERTAG_RELATION_KIND_EXTENSION = 2;
  SUPERTAG_RELATION_KIND_TEMPLATE_NODE = 3;
  SUPERTAG_RELATION_KIND_TEMPLATE_FIELD_VISIBILITY = 4;
  SUPERTAG_RELATION_KIND_TEMPLATE_FIELD = 5;
  SUPERTAG_RELATION_KIND_TEMPLATE_FIELD_STATIC_DEFAULT = 6;
  SUPERTAG_RELATION_KIND_OPTIONAL_FIELD = 7;
}

enum DiffSpaceKind {
  DIFF_SPACE_KIND_UNSPECIFIED = 0;
  DIFF_SPACE_KIND_NODE_CONTENT = 1;
  DIFF_SPACE_KIND_CHILD_SEQUENCE = 2;
  DIFF_SPACE_KIND_LIFECYCLE = 3;
  DIFF_SPACE_KIND_OWNER = 4;
  DIFF_SPACE_KIND_SUPERTAG_APPLICATION = 5;
  DIFF_SPACE_KIND_SUPERTAG_TEMPLATE = 6;
  DIFF_SPACE_KIND_MATERIALIZED_FIELD = 7;
  DIFF_SPACE_KIND_INLINE_REFERENCE = 8;
  DIFF_SPACE_KIND_VIEW_DEFINITION = 9;
  DIFF_SPACE_KIND_FIELD_DEFINITION_CONFIGURATION = 10;
  DIFF_SPACE_KIND_SEARCH_EXPRESSION = 11;
}

enum RecoveryAction {
  RECOVERY_ACTION_UNSPECIFIED = 0;
  RECOVERY_ACTION_RESTORE_SUPPORT = 1;
}

enum PlacementEndpoint {
  PLACEMENT_ENDPOINT_UNSPECIFIED = 0;
  PLACEMENT_ENDPOINT_BEFORE = 1;
  PLACEMENT_ENDPOINT_AFTER = 2;
  PLACEMENT_ENDPOINT_MISSING = 3;
}

message MarkChange {
  string atom_id = 1;
  string key = 2;
  PreviousValue origin = 3;
  PreviousValue review = 4;
}

message TextDecisionEffect {
  string node_id = 1;
  repeated string added_atom_ids = 2;
  repeated string deleted_atom_ids = 3;
  repeated MarkChange mark_changes = 4;
}

message PlacementRelation {
  bool parent_matches = 1;
  optional PlacementEndpoint after_endpoint = 2;
  optional PlacementEndpoint before_endpoint = 3;
}

message StructureDecisionEffect {
  string occurrence_id = 1;
  bool origin_present = 2;
  bool review_present = 3;
  google.protobuf.StringValue origin_parent_id = 4;
  google.protobuf.StringValue review_parent_id = 5;
  SequenceAnchor anchor = 6;
  PlacementRelation origin_relation = 7;
  PlacementRelation review_relation = 8;
}

message LifecycleDecisionEffect {
  string identity = 1;
  google.protobuf.BoolValue origin = 2;
  google.protobuf.BoolValue review = 3;
}

message OwnerDecisionEffect {
  string identity = 1;
  google.protobuf.StringValue origin = 2;
  google.protobuf.StringValue review = 3;
}

message IntrinsicNodeTypeDecisionEffect {
  string identity = 1;
  optional IntrinsicNodeType origin = 2;
  optional IntrinsicNodeType review = 3;
}

message SupertagRelationDecisionEffect {
  SupertagRelationKind relation = 1;
  string owner_id = 2;
  string target_id = 3;
  google.protobuf.Int32Value origin_index = 4;
  google.protobuf.Int32Value review_index = 5;
}

message FieldMaterializationDecisionEffect {
  string owner_node_id = 1;
  string field_definition_id = 2;
  google.protobuf.StringValue origin_field_node_id = 3;
  google.protobuf.StringValue review_field_node_id = 4;
  google.protobuf.StringValue origin_field_occurrence_id = 5;
  google.protobuf.StringValue review_field_occurrence_id = 6;
}

message InlineReferenceDecisionState {
  string host_node_id = 1;
  string target_node_id = 2;
  google.protobuf.StringValue alias_node_id = 3;
  InlineReferenceTargetStatus target_status = 4;
  SequenceAnchor anchor = 5;
}

message InlineReferenceDecisionEffect {
  string inline_reference_id = 1;
  InlineReferenceDecisionState origin = 2;
  InlineReferenceDecisionState review = 3;
}

message SearchExpressionDecisionState {
  bool present = 1;
  google.protobuf.StringValue host_id = 2;
  google.protobuf.StringValue parent_expression_id = 3;
  SequenceAnchor anchor = 4;
  SearchClause clause = 5;
}

message SearchExpressionDecisionEffect {
  string expression_id = 1;
  SearchExpressionDecisionState origin = 2;
  SearchExpressionDecisionState review = 3;
}

message ViewDefinitionDecisionState {
  string host_node_id = 1;
  string attachment_node_id = 2;
  string attachment_occurrence_id = 3;
  ViewType view_type = 4;
  ViewOptionsSpec options = 5;
  bool options_conflicted = 6;
}

message ViewDefinitionDecisionEffect {
  string view_id = 1;
  ViewDefinitionDecisionState origin = 2;
  ViewDefinitionDecisionState review = 3;
}

message FieldDefinitionConfigurationDecisionState {
  oneof configuration {
    string datatype_node_id = 1;
    string cardinality_node_id = 2;
    FieldInitializationExpression initialization_expression = 3;
    string optionality_node_id = 4;
  }
}

message FieldDefinitionConfigurationDecisionEffect {
  string field_definition_id = 1;
  string configuration_kind = 2;
  FieldDefinitionConfigurationDecisionState origin = 3;
  FieldDefinitionConfigurationDecisionState review = 4;
}

message DecisionEffect {
  oneof effect {
    TextDecisionEffect text = 1;
    StructureDecisionEffect structure = 2;
    LifecycleDecisionEffect lifecycle = 3;
    OwnerDecisionEffect owner = 4;
    IntrinsicNodeTypeDecisionEffect intrinsic_node_type = 5;
    SupertagRelationDecisionEffect supertag_relation = 6;
    FieldMaterializationDecisionEffect field_materialization = 7;
    InlineReferenceDecisionEffect inline_reference = 8;
    ViewDefinitionDecisionEffect view_definition = 9;
    FieldDefinitionConfigurationDecisionEffect field_definition_configuration = 10;
    SearchExpressionDecisionEffect search_expression = 11;
  }
}

message ReviewEvidence {
  repeated DecisionEffect effects = 1;
  repeated string associated_impact_ids = 2;
}

message ReviewSelection {
  string evidence_id = 1;
  repeated string proposal_action_ids = 2;
}

message DiffSpace {
  DiffSpaceKind kind = 1;
  string identity = 2;
}

message ReviewHunk {
  string id = 1;
  DiffSpace diff_space = 2;
  repeated string neutral_bridge_atom_ids = 3;
  repeated string linked_hunk_ids = 4;
  ReviewEvidence evidence = 5;
  ReviewSelection selection = 6;
}

message ReviewQueryResult {
  string generation_id = 1;
  map<string, uint64> frontier = 2;
  repeated ReviewHunk hunks = 3;
  google.protobuf.StringValue next = 4;
}

message ResolutionConflictCandidate {
  string resolution_id = 1;
  ResolutionDecision decision = 2;
  string actor_id = 3;
  string replica_id = 4;
  map<string, uint64> observed_frontier = 5;
}

message UnsupportedDirectIntentConflict {
  string identity = 1;
  string fact_action_id = 2;
  FactActionKind action_kind = 3;
  string actor_id = 4;
  string replica_id = 5;
  map<string, uint64> observed_frontier = 6;
  repeated string missing_support_action_ids = 7;
  repeated string required_node_ids = 8;
  repeated RecoveryAction recovery_actions = 9;
}

message IntrinsicNodeTypeConflictCandidate {
  string fact_action_id = 1;
  IntrinsicNodeType intrinsic_node_type = 2;
  string actor_id = 3;
  string replica_id = 4;
  map<string, uint64> observed_frontier = 5;
}

message IntrinsicNodeTypeConflict {
  string identity = 1;
  string node_id = 2;
  repeated IntrinsicNodeTypeConflictCandidate candidates = 3;
}

message ResolutionConflict {
  string identity = 1;
  repeated string proposal_fact_ids = 2;
  repeated ResolutionConflictCandidate candidates = 3;
}

message PlacementConflictCandidate {
  string fact_action_id = 1;
  string parent_node_id = 2;
  SequenceAnchor anchor = 3;
  string actor_id = 4;
  string replica_id = 5;
  map<string, uint64> observed_frontier = 6;
}

message PlacementConflict {
  string identity = 1;
  string occurrence_id = 2;
  string canonical_parent_node_id = 3;
  repeated PlacementConflictCandidate candidates = 4;
}

message OriginalConflictCandidate {
  string fact_action_id = 1;
  string placement_id = 2;
  string actor_id = 3;
  string replica_id = 4;
  map<string, uint64> observed_frontier = 5;
}

message OriginalConflict {
  string identity = 1;
  string node_id = 2;
  string canonical_placement_id = 3;
  repeated OriginalConflictCandidate candidates = 4;
}

message SupertagExtensionCycleConflict {
  string identity = 1;
  repeated string supertag_ids = 2;
}

message ConflictIssue {
  oneof issue {
    UnsupportedDirectIntentConflict unsupported_direct_intent = 1;
    IntrinsicNodeTypeConflict intrinsic_node_type_conflict = 2;
    ResolutionConflict resolution_conflict = 3;
    PlacementConflict placement_conflict = 4;
    SupertagExtensionCycleConflict supertag_extension_cycle = 5;
    OriginalConflict original_conflict = 6;
  }
}

message ConflictQueryResult {
  string generation_id = 1;
  map<string, uint64> frontier = 2;
  repeated ConflictIssue issues = 3;
  google.protobuf.StringValue next = 4;
}
