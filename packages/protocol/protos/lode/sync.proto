syntax = "proto3";

package lode;

// The sync protocol envelope exchanged over a broker workspace channel (design sync-design.md §4).
// Each peer runs both halves: the initiator publishes a correlated request (profile_req /
// updates_req) and awaits the matching response by req_id; the responder answers from its local
// store, and updates_push is a one-way push. `body` and `version` are opaque byte blobs at this
// layer — a SyncableDoc's opaque version + incremental update bytes (impl-agnostic; the CRDT
// backend is closed behind the engine's SyncableDoc/SyncableComposite interfaces). `sub_doc_id`
// names a physical syncable doc within the workspace's content composite (the tree channel or a
// shard id), matched across peers by id.

message ProfileReq { string req_id = 1; }
message ProfileResp { string req_id = 1; bytes body = 2; }
message UpdatesReq { string req_id = 1; string sub_doc_id = 2; bytes body = 3; }
message UpdatesResp { string req_id = 1; bytes body = 2; }
message UpdatesPush { string sub_doc_id = 1; bytes body = 2; }

message SyncMessage {
  oneof kind {
    ProfileReq profile_req = 1;
    ProfileResp profile_resp = 2;
    UpdatesReq updates_req = 3;
    UpdatesResp updates_resp = 4;
    UpdatesPush updates_push = 5;
  }
}

// A peer's per-doc versions — the cheap metadata exchanged first to find what differs. `version`
// is the SyncableDoc's opaque version bytes (impl-agnostic).
message SyncProfileEntry { string sub_doc_id = 1; bytes version = 2; }
message SyncProfile { repeated SyncProfileEntry entries = 1; }
