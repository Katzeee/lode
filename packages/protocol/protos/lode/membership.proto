syntax = "proto3";

package lode;

// The replicated, signed, append-only membership log (design sync-identity-persistence §2 + §13).
// NOT an ACL — lode has no authoritative server, so this records who is in a workspace, who owns it,
// and each peer's transit key. Two roles: owner (single governance authority) + member(rw). The
// owner alone signs governance records (root/rotate/transfer); an actor may self-sign `add` for its
// own further peers. Records are stored as MembershipRecord bytes in a LoroList and synced like any
// doc; invalid records are skipped at replay (deterministic → all replicas converge). Signatures
// (MembershipRecord.sig) cover the deterministic proto3 encoding of the chosen `body` message — the
// wrapped set is `repeated PeerWrap` (ordered, not a map) so the signed bytes are canonical.
//
// Vocabulary (§13): a "peer" is the membership unit — one dataRoot replica (peerId + transit key).
// A "member" is an actor who participates in the workspace (owns ≥1 peer); "owner" is the governance
// role. Each admitted peer carries a random X25519 enc pub (the transit-wrap target); the owning
// actor's sign pub is NOT carried — it is recovered from the actorId (actorId IS the hex of the
// Ed25519 sign pub, reversible). The peer key never signs; every record is signed by an actor
// (owner or self).

// A peer entry: one admitted peerId. The transit key is wrapped to peer_enc_pub.
message PeerWrap {
  string peer_id = 1;         // the peerId — the membership unit / revocation handle (one dataRoot)
  string owning_actor_id = 2; // hex Ed25519 pub of the owning actor (attribution + sign pub recovery)
  bytes peer_enc_pub = 3;     // 32-byte X25519 — the transit key is wrapped to this
  bytes wrapped_transit = 4;  // the transit key, sealed to peer_enc_pub
  string peer_name = 5;       // human label ("Alice's laptop"); set at admission, advisory (UI-only)
}

// Owner self-signs the workspace root; carries the owner's transit key wrapped to the owner's FIRST
// peer. Only the FIRST root applies; a later root is skipped.
message RootRecord {
  string owner = 1;                  // owner actorId (hex Ed25519 pub)
  bytes owner_peer_enc_pub = 2;      // owner's first peer X25519 enc pub
  string owner_peer_id = 3;          // owner's first peerId
  bytes wrapped_transit = 4;         // transit key, sealed to owner_peer_enc_pub
  int32 epoch = 5;
  string peer_name = 6;              // owner's first peer's human label (set at workspace create)
}

// Add a peer. Owner-signed when adding an actor's FIRST peer (establishes the actor); self-signed
// by owning_actor when adding a further peer (signer === owning_actor, already a member). Transit
// key wrapped to the peer.
message AddRecord {
  string owning_actor = 1;     // hex Ed25519 pub of the actor owning this peer
  bytes peer_enc_pub = 2;      // 32-byte X25519 of the peer being added
  string peer_id = 3;          // the peerId
  bytes wrapped_transit = 4;   // transit key, sealed to peer_enc_pub
  int32 epoch = 5;             // join epoch (a stale add — epoch < current — is skipped)
  string peer_name = 6;        // the peer's human label (set at admission)
}

// Owner re-keys. `wrapped` IS the new membership: every peer listed gets the new transit key; any
// peer omitted is revoked (atomic removeAndRotate). enc_prev = AEAD(newTransitKey, oldTransitKey)
// chains the old key under the new so current members walk back to decrypt prior epochs. The owner
// must have ≥1 surviving peer (a rotate that drops every owner peer would brick governance).
message RotateRecord {
  int32 epoch = 1;
  repeated PeerWrap wrapped = 2;
  bytes enc_prev = 3;
}

// Owner transfers ownership to an actor that already owns ≥1 peer (so the new owner already holds
// the transit key; only governance authority moves). The old owner's peers stay admitted.
message TransferRecord {
  string new_owner = 1; // new owner actorId (must own ≥1 peer)
}

// One signed log entry. `signer` is an actorId (the owner for governance, or the owning actor for a
// self-service add). `sig` is an Ed25519 signature over the encoded `body`, verified with the sign
// pub recovered from `signer` (actorId is the hex of that pub). Root self-authorizes (signer == owner,
// first record); every non-root governance record must be signed by the current owner.
message MembershipRecord {
  string signer = 1;
  bytes sig = 2;
  oneof body {
    RootRecord root = 3;
    AddRecord add = 4;
    RotateRecord rotate = 5;
    TransferRecord transfer = 6;
  }
}
