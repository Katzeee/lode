syntax = "proto3";

package lode;

enum HardDeleteBlocker {
  HARD_DELETE_BLOCKER_UNSPECIFIED = 0;
  HARD_DELETE_BLOCKER_ALREADY_PURGED = 1;
  HARD_DELETE_BLOCKER_NOT_IN_TRASH = 2;
  HARD_DELETE_BLOCKER_PENDING_PROPOSAL = 3;
  HARD_DELETE_BLOCKER_REPLICA_UNCONFIRMED = 4;
  HARD_DELETE_BLOCKER_OWNED_DESCENDANTS = 5;
}

message HardDeleteSelection {
  string workspace_id = 1;
  map<string, uint64> frontier = 2;
  string node_id = 3;
  repeated string deletion_fact_ids = 4;
  repeated string acknowledgement_fact_ids = 5;
  repeated string retired_replica_ids = 6;
}

message HardDeleteHistoryImpact {
  repeated string affected_invocation_ids = 1;
  repeated string affected_channel_ids = 2;
  uint32 total_affected_invocations = 3;
  bool truncated = 4;
}

message HardDeletePreview {
  string generation_id = 1;
  HardDeleteSelection selection = 2;
  repeated string reference_occurrence_ids = 3;
  repeated string supertag_application_node_ids = 4;
  repeated string materialized_field_node_ids = 5;
  repeated string pending_proposal_contribution_ids = 6;
  repeated string known_replica_ids = 7;
  repeated string acknowledged_replica_ids = 8;
  repeated HardDeleteBlocker blockers = 9;
  bool can_execute = 10;
  HardDeleteHistoryImpact history_impact = 11;
  repeated string owned_descendant_node_ids = 12;
}
