syntax = "proto3";

package lode;

import "google/protobuf/empty.proto";
import "lode/commands.proto";

service LodeCommands {
  rpc OpenWorkspace(OpenWorkspaceRequest) returns (google.protobuf.Empty);
  rpc RecoverWorkspaceAuthority(OpenWorkspaceRequest) returns (google.protobuf.Empty);
  rpc Request(EngineEnvelope) returns (EngineEnvelope);
  rpc SyncWorkspace(WorkspaceSyncRequest) returns (google.protobuf.Empty);
  rpc SyncProfile(WorkspaceSyncProfileRequest) returns (WorkspaceSyncProfile);
  rpc SyncFetch(WorkspaceSyncFetchRequest) returns (EngineEnvelope);
  rpc SyncSend(WorkspaceSyncSendRequest) returns (google.protobuf.Empty);
  rpc ListenEngineEvents(google.protobuf.Empty) returns (stream EngineEnvelope);
  rpc Shutdown(google.protobuf.Empty) returns (google.protobuf.Empty);
}
