syntax = "proto3";

package lode;

import "google/protobuf/struct.proto";

// Lode wire contract — request/response messages for the LodeCommands service.
// This file is the single source of truth for the data shapes exchanged between
// any client (cli/gui/tui over Connect, mobile in-process) and the engine.
// Flat field naming mirrors the existing TS DTOs so engine handlers change minimally.

// ---- shared enums ----

enum FieldType {
  PLAIN = 0;
  REFERENCE = 1;
  OPTION = 2;
  DATE = 3;
  CHECKBOX = 4;
}

enum FieldPresence {
  NORMAL = 0;
  OPTIONAL_PRESENCE = 1;
}

enum FieldMode {
  REUSE_EXISTING = 0;
  CREATE_ONLY = 1;
}

enum DomainChangeKind {
  FIELD_SLOT = 0;
  TEMPLATE_REF = 1;
  FIELD_VALUE = 2;
}

enum DomainChangeReason {
  CREATED = 0;
  REUSED = 1;
  MOVED = 2;
  DELETED = 3;
  KEPT = 4;
  PROVENANCE_UPDATED = 5;
}

// ---- shared messages ----

message Delta {
  string insert = 1;
  optional google.protobuf.Struct attributes = 2;
}

// Canonical node occurrence shape returned by node/ref RPCs.
// parent_occurrence_id: null and absent are equivalent (root occurrence) for lode.
message NodeOccurrenceWire {
  string node_id = 1;
  string occurrence_id = 2;
  optional string parent_occurrence_id = 3;
  string canonical_occurrence_id = 4;
  repeated string canonical_child_occurrence_ids = 5;
  google.protobuf.Struct props = 6;
  google.protobuf.Struct entity_meta = 7;
  google.protobuf.Struct occurrence_props = 8;
  google.protobuf.Struct occurrence_meta = 9;
  repeated Delta deltas = 10;
}

message NodeOccurrenceRef {
  string node_id = 1;
  string occurrence_id = 2;
}

message NodeRef {
  string node_id = 1;
}

message Origin {
  string node_id = 1;
  string actor_id = 2;
  string session_id = 3;
}

message Actor {
  string actor_id = 1;
  optional string display_name = 2;
  optional google.protobuf.Struct metadata = 3;
}

message ClientInfo {
  optional string name = 1;
  optional string version = 2;
  optional google.protobuf.Struct metadata = 3;
}

message WorkspaceInfo {
  string workspace_id = 1;
  string display_name = 2;
}

message DomainChange {
  DomainChangeKind kind = 1;
  DomainChangeReason reason = 2;
  string node_id = 3;
  string occurrence_id = 4;
}

message FieldValueInput {
  oneof value {
    FieldTextValue text = 1;
    FieldRefValue ref = 2;
    FieldMoveValue move = 3;
  }
}

message FieldTextValue {
  string text = 1;
}

message FieldRefValue {
  string target_node_id = 1;
}

message FieldMoveValue {
  string occurrence_id = 1;
}

// ---- session ----

message SessionHelloRequest {
  optional ClientInfo client = 2;
  // The actor's BIP-39 mnemonic; the daemon derives the keypair (identity = the derived actor id).
  // No declared actor: the id is fully determined by the mnemonic, so it carries nothing extra.
  string mnemonic = 3;
}

message SessionInfo {
  string session_id = 1;
  Actor actor = 2;
  int64 connected_at = 3; // epoch millis
  optional ClientInfo client = 4;
}

// ---- vault (daemon-side encrypted identity store) ----

// The daemon's identity vault state. LOCKED = no keypair in memory (vault.json at rest or absent);
// UNLOCKED = keypair(s) loaded + lease valid; GRACE = keypairs still in memory (sync is registered,
// needs them) but the lease expired, so interactive access is gated until re-confirm (PIN/passphrase).
enum VaultState {
  VAULT_LOCKED = 0;
  VAULT_UNLOCKED = 1;
  VAULT_GRACE = 2;
}

// An identity held in the vault. Labels are public (shown when LOCKED); the mnemonic is encrypted
// at rest and only decrypted into memory on unlock.
message VaultIdentity {
  string actor_id = 1;
  string label = 2;
  int64 created_at = 3; // epoch millis
}

message VaultStatus {
  VaultState state = 1;
  repeated VaultIdentity identities = 2;
  bool has_pin = 3;           // a PIN verifier is set
  int64 active_until = 4;     // epoch ms the unlock lease expires (0 if locked / session policy)
  int32 pin_failed_count = 5; // wrong-PIN attempts since last success (resets on unlock/daemon restart)
}

message InitVaultRequest {
  string passphrase = 1;
}

message CreateIdentityRequest {
  string label = 1;
}

// The freshly minted mnemonic — shown ONCE as a backup, then encrypted into the vault at rest.
message CreateIdentityResponse {
  string actor_id = 1;
  string mnemonic = 2;
}

message ImportIdentityRequest {
  string mnemonic = 1;
  string label = 2;
}

message ImportIdentityResponse {
  string actor_id = 1;
}

message UnlockVaultRequest {
  string passphrase = 1;
}

message SetPinRequest {
  string pin = 1;
}

message UnlockWithPinRequest {
  string pin = 1;
}

// ---- subscription ----

message SubscribeDocRequest {
  string workspace_id = 1;
}

message UnsubscribeDocRequest {
  string workspace_id = 1;
}

// ---- workspace ----

message CreateWorkspaceRequest {
  optional string workspace_id = 1;
  string display_name = 2;
  optional string peer_name = 3; // the creator's peer label ("Alice's laptop"); stored on the root
}

// Fork a workspace: copy the source's content (treeDoc + shards) into a NEW workspace (new wsId)
// with an EMPTY membership log + a fresh owner root signed by the forker's actor. Recovery for
// kicked / lost-owner / rogue-owner (design sync-identity-persistence §13). The forker becomes the
// new owner at epoch 0; the source's membership log + re-key chain do NOT carry over. Content is
// plaintext at rest (the transit key is wire-only), so the copy has no decryption gap.
message ForkWorkspaceRequest {
  string workspace_id = 1;       // the SOURCE workspace to fork (its content is copied verbatim)
  string display_name = 2;       // the new workspace's display name
  optional string peer_name = 3; // the forker's peer label for the new workspace's root
}

message RemoveWorkspaceRequest {
  string workspace_id = 1;
}

message ListWorkspacesResponse {
  repeated WorkspaceInfo workspaces = 1;
}

// ---- node ----

message CreatePlainNodeRequest {
  string workspace_id = 1;
  string parent_occurrence_id = 3;
  optional int32 index = 4;
  optional google.protobuf.Struct props = 5;
}

message GetNodeRequest {
  string workspace_id = 1;
  string occurrence_id = 3;
}

message GetNodeResponse {
  optional NodeOccurrenceWire occurrence = 1;
}

message GetNodeByIdRequest {
  string workspace_id = 1;
  string node_id = 3;
}

message GetNodeChildrenRequest {
  string workspace_id = 1;
  string occurrence_id = 3;
}

message GetNodeChildrenResponse {
  repeated NodeOccurrenceWire children = 1;
}

message ListRootsRequest {
  string workspace_id = 1;
}

message ListRootsResponse {
  // The workspace's top-level (root) occurrences. After single-root, exactly one for an owner-created
  // workspace (the joiner converges it via sync); empty before the root has arrived.
  repeated NodeOccurrenceWire roots = 1;
}

message MoveNodeRequest {
  string workspace_id = 1;
  string occurrence_id = 3;
  string parent_occurrence_id = 4;
  optional int32 index = 5;
}

message RemoveNodeOccurrenceRequest {
  string workspace_id = 1;
  string occurrence_id = 3;
}

message HardDeleteNodeRequest {
  string workspace_id = 1;
  string node_id = 3;
}

message PromoteCanonicalNodeRequest {
  string workspace_id = 1;
  string node_id = 3;
  string occurrence_id = 4;
}

message ReplaceNodeTextRequest {
  string workspace_id = 1;
  string occurrence_id = 3;
  repeated Delta deltas = 4;
}

message SetNodePropRequest {
  string workspace_id = 1;
  string occurrence_id = 3;
  string key = 4;
  google.protobuf.Value value = 5;
}

message UnsetNodePropRequest {
  string workspace_id = 1;
  string occurrence_id = 3;
  string key = 4;
}

message SetOccurrencePropRequest {
  string workspace_id = 1;
  string occurrence_id = 3;
  string key = 4;
  google.protobuf.Value value = 5;
}

message UnsetOccurrencePropRequest {
  string workspace_id = 1;
  string occurrence_id = 3;
  string key = 4;
}

// ---- ref ----

message CreateRefRequest {
  string workspace_id = 1;
  string target_node_id = 3;
  string parent_occurrence_id = 4;
  optional int32 index = 5;
}

message CloneRefRequest {
  string workspace_id = 1;
  string occurrence_id = 3;
  string parent_occurrence_id = 4;
  optional int32 index = 5;
}

// ---- schema ----

message CreateSchemaRequest {
  string workspace_id = 1;
  string name = 3;
  string parent_occurrence_id = 4;
}

message ApplySchemaRequest {
  string workspace_id = 1;
  string target_occurrence_id = 3;
  string schema_node_id = 4;
}

message RemoveSchemaRequest {
  string workspace_id = 1;
  string target_occurrence_id = 3;
  string schema_node_id = 4;
}

message ReconcileSchemaRequest {
  string workspace_id = 1;
  string target_occurrence_id = 3;
}

message SchemaChangeResult {
  NodeOccurrenceRef target = 1;
  optional NodeRef schema = 2;
  repeated DomainChange changes = 3;
}

// ---- fieldDef ----

message CreateFieldDefRequest {
  string workspace_id = 1;
  string parent_occurrence_id = 3;
  string name = 4;
  optional FieldType field_type = 5;
  optional FieldPresence presence = 6;
}

message SetFieldDefTypeRequest {
  string workspace_id = 1;
  string field_def_node_id = 3;
  FieldType field_type = 4;
}

message SetFieldDefPresenceRequest {
  string workspace_id = 1;
  string field_def_node_id = 3;
  FieldPresence presence = 4;
}

// ---- field ----

message AddFieldRequest {
  string workspace_id = 1;
  string target_occurrence_id = 3;
  string field_def_node_id = 4;
  optional FieldMode mode = 5;
}

message AddFieldResult {
  string node_id = 1;
  string occurrence_id = 2;
  bool created = 3;
}

message SetFieldValuesRequest {
  string workspace_id = 1;
  string field_occurrence_id = 3;
  repeated FieldValueInput values = 4;
}

message SetFieldValuesResult {
  NodeOccurrenceRef field = 1;
  repeated DomainChange changes = 2;
}

message RemoveFieldRequest {
  string workspace_id = 1;
  string field_occurrence_id = 3;
}

// ---- history ----

message UndoHistoryRequest {
  string workspace_id = 1;
}

message RedoHistoryRequest {
  string workspace_id = 1;
}

message CanUndoHistoryRequest {
  string workspace_id = 1;
}

message CanRedoHistoryRequest {
  string workspace_id = 1;
}

// ---- editing — composite/intent ops (one undo step each) ----

message PasteNodesRequest {
  string workspace_id = 1;
  repeated string source_occurrence_ids = 2;
  string target_parent_occurrence_id = 3;
  optional int32 index = 4;
}

message PasteNodesResult {
  repeated NodeOccurrenceRef occurrences = 1;
}

message DuplicateNodeRequest {
  string workspace_id = 1;
  string occurrence_id = 2;
}

message IndentRequest {
  string workspace_id = 1;
  repeated string occurrence_ids = 2;
}

message OutdentRequest {
  string workspace_id = 1;
  string occurrence_id = 2;
}

message MoveSiblingRequest {
  string workspace_id = 1;
  string occurrence_id = 2;
  bool up = 3;
}

// ---- sync ----
// Runtime governance + share/join. These are host-side concerns (the daemon owns the sync runner +
// the owner identity); mobile wires its own equivalent in-process. The wire contract stays here so
// every client surface speaks the same LodeCommands service.

// Owner adds a peer (an actor's first peer, or a further peer the owner is admitting). The
// joiner hands their peer tuple (peerId + X25519 enc pub) + owning actor to the owner out of band.
message AddMemberRequest {
  string workspace_id = 1;
  bytes peer_enc_pub = 2;     // 32-byte X25519 of the peer being admitted
  string peer_id = 3;         // the peerId
  string owning_actor_id = 4; // hex Ed25519 pub of the actor owning this peer
  optional string peer_name = 5; // the peer's human label (from the identity token)
}

// This session's local peer identity (per-dataRoot peerId + X25519 enc pub + the session's actor).
// The tuple a joiner hands to an owner out-of-band so the owner can `AddMember` it.
message GetPeerPublicKeysResponse {
  string peer_id = 1;
  bytes peer_enc_pub = 2;
  string owning_actor_id = 3;
}

// A portable identity token — the ONE thing a user exports (`lode identity export`) and hands to an
// owner out-of-band; the owner pastes it into `lode member add`. Bundles the (actor + peer) tuple so
// the user never handles the individual cryptographic fields. Wire format: `lode-id1.<base64url(
// PeerIdentityToken)>`. `display_name` is advisory (shown by the owner's CLI on add; the membership
// log keys on `actor_id`). Defined here so the format is shared across every client surface.
message PeerIdentityToken {
  string actor_id = 1;
  string peer_id = 2;
  bytes peer_enc_pub = 3;
  string display_name = 4;    // advisory actor display name (shown by the owner's CLI on add)
  string peer_name = 5;       // the peer's human label ("Alice's laptop"); stored on the peer record
}

// `lode member list` — the current roster, projected from the membership log. Peers are returned
// FLAT (the membership unit); the CLI groups them by `owning_actor_id` and flags the owner. No
// transit material leaks here (this is a read-only roster view, not `PeerWrap`).
message ListMembersRequest {
  string workspace_id = 1;
}

message ListedPeer {
  string peer_id = 1;
  string peer_name = 2;
  string owning_actor_id = 3;
}

message ListMembersResponse {
  repeated ListedPeer peers = 1;
  string owner = 2;   // owner actorId
  int32 epoch = 3;    // current epoch
}

// Owner revokes a peer. Exactly one of peer_id / actor_id: peer_id revokes one peer; actor_id
// revokes every peer of that actor (they leave the workspace). Owner-only (engine enforces).
message RevokePeerRequest {
  string workspace_id = 1;
  optional string peer_id = 2;
  optional string actor_id = 3;
}

// An actor self-adds their own further peer. The new peer (e.g. a phone) exported an identity token;
// the actor pastes it here from an ADMITTED peer (e.g. their laptop). owning_actor_id is the session
// actor — not in the request (the engine asserts it equals the new peer's owning actor).
message AddPeerRequest {
  string workspace_id = 1;
  bytes peer_enc_pub = 2;
  string peer_id = 3;
  string peer_name = 4;
  string owning_actor_id = 5; // the token's actorId — daemon asserts it equals the session actor
}

// Owner transfers governance to `new_owner_actor_id` (must already own ≥1 peer).
message TransferOwnerRequest {
  string workspace_id = 1;
  string new_owner_actor_id = 2;
}

// Owner manually re-keys (forward-secrecy rotation, independent of a revoke; same roster).
message RotateTransitRequest {
  string workspace_id = 1;
}

message ActorPublicKeys {
  string actor_id = 1; // hex of the Ed25519 sign pub
  bytes sign_pub = 2; // 32-byte Ed25519 sign pub
}

message ShareWorkspaceRequest {
  string workspace_id = 1;
}

// The payload an owner hands to a joiner (out of band). relay_url = where to dial; workspace_id =
// the broker channel. (The single content doc is auto-created at createWorkspace — no doc id crosses
// the coordinate; CRDT sync targets it implicitly.)
message WorkspaceCoordinate {
  string relay_url = 1;
  string workspace_id = 2;
}

message JoinWorkspaceRequest {
  WorkspaceCoordinate coordinate = 1;
}

// Register the session's actor to drive sync for `workspace_id` via `relay_url`. The actor keypair
// comes from the session (sessionHello), not the request — the client never re-sends its key.
message RegisterSyncRequest {
  string workspace_id = 1;
  string relay_url = 2;
}

// Manual trigger: run one sync round for `workspace_id` now (`lode sync now`), instead of waiting
// for the next tick.
message SyncNowRequest {
  string workspace_id = 1;
}
