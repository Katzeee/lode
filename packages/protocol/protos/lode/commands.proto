syntax = "proto3";

package lode;

// The protobuf boundary transports the canonical EngineContract envelope without
// re-declaring domain commands, mutations, selections, results, errors, or events.
message EngineEnvelope {
  bytes payload = 1;
}

message OpenWorkspaceRequest {
  string workspace_id = 1;
}

message WorkspaceSyncRequest {
  string workspace_id = 1;
  string remote_endpoint = 2;
}

message WorkspaceSyncProfileRequest {
  string workspace_id = 1;
}

message WorkspaceSyncProfileEntry {
  string document_id = 1;
  bytes version = 2;
}

message WorkspaceSyncProfile {
  repeated WorkspaceSyncProfileEntry entries = 1;
}

message WorkspaceSyncFetchRequest {
  string workspace_id = 1;
  string document_id = 2;
  bytes from = 3;
}

message WorkspaceSyncSendRequest {
  string workspace_id = 1;
  string document_id = 2;
  bytes payload = 3;
}
