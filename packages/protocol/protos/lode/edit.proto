syntax = "proto3";

package lode;

import "google/protobuf/struct.proto";
import "lode/model.proto";

enum EditMutationKind {
  EDIT_MUTATION_KIND_UNSPECIFIED = 0;
  EDIT_MUTATION_KIND_NODE_CREATE = 1;
  EDIT_MUTATION_KIND_REFERENCE_PROMOTE = 2;
  EDIT_MUTATION_KIND_NODE_DELETE = 3;
  EDIT_MUTATION_KIND_NODE_RESTORE = 4;
  EDIT_MUTATION_KIND_OCCURRENCE_CREATE = 5;
  EDIT_MUTATION_KIND_OCCURRENCE_DELETE = 6;
  EDIT_MUTATION_KIND_OCCURRENCE_RESTORE = 7;
  EDIT_MUTATION_KIND_OCCURRENCE_MOVE = 8;
  EDIT_MUTATION_KIND_NODE_TYPE_DECLARE = 9;
  EDIT_MUTATION_KIND_SCHEMA_APPLY = 10;
  EDIT_MUTATION_KIND_SCHEMA_REMOVE = 11;
  EDIT_MUTATION_KIND_SCHEMA_FIELD_ADD = 12;
  EDIT_MUTATION_KIND_SCHEMA_FIELD_REMOVE = 13;
  EDIT_MUTATION_KIND_SCHEMA_FIELD_CONFIGURE = 14;
  EDIT_MUTATION_KIND_SCHEMA_EXTENSION_ADD = 15;
  EDIT_MUTATION_KIND_SCHEMA_EXTENSION_REMOVE = 16;
  EDIT_MUTATION_KIND_SCHEMA_TEMPLATE_NODE_ADD = 17;
  EDIT_MUTATION_KIND_SCHEMA_TEMPLATE_NODE_REMOVE = 18;
  EDIT_MUTATION_KIND_TEMPLATE_NODE_DETACH = 19;
  EDIT_MUTATION_KIND_FIELD_MATERIALIZE = 20;
  EDIT_MUTATION_KIND_FIELD_VALUE_DELETE = 21;
  EDIT_MUTATION_KIND_MATERIALIZED_FIELD_DELETE = 22;
  EDIT_MUTATION_KIND_TEXT_SPLICE = 23;
  EDIT_MUTATION_KIND_TEXT_MARK = 24;
  EDIT_MUTATION_KIND_VALUE_SET = 25;
  EDIT_MUTATION_KIND_VALUE_UNSET = 26;
}

message NodeCreateMutation {
  string node_id = 2;
  string occurrence_id = 3;
  string parent_node_id = 4;
  SequenceAnchor anchor = 5;
  optional NodeSeed seed = 6;
  optional NodeType node_type = 7;
}

message ReferencePromoteMutation { string occurrence_id = 2; }
message NodeDeleteMutation { string node_id = 2; }
message NodeRestoreMutation { string node_id = 2; string deletion_fact_id = 3; }

message OccurrenceCreateMutation {
  string occurrence_id = 2;
  string node_id = 3;
  string parent_node_id = 4;
  SequenceAnchor anchor = 5;
}

message OccurrenceDeleteMutation {
  string occurrence_id = 2;
  optional string previous_parent_node_id = 3;
  optional SequenceAnchor previous_anchor = 4;
}

message OccurrenceRestoreMutation {
  string occurrence_id = 2;
  string deletion_fact_id = 3;
  string parent_node_id = 4;
  SequenceAnchor anchor = 5;
}

message OccurrenceMoveMutation {
  string occurrence_id = 2;
  string parent_node_id = 3;
  SequenceAnchor anchor = 4;
  optional string previous_parent_node_id = 5;
  optional SequenceAnchor previous_anchor = 6;
}

message NodeTypeDeclareMutation { string node_id = 2; NodeType node_type = 3; }
message SchemaApplyMutation { string node_id = 2; string schema_id = 3; SequenceAnchor anchor = 4; }
message SchemaRemoveMutation { string node_id = 2; string schema_id = 3; optional SequenceAnchor previous_anchor = 4; }

message SchemaFieldAddMutation {
  string schema_id = 2;
  string field_definition_id = 3;
  string field_node_id = 4;
  string field_occurrence_id = 5;
  SequenceAnchor anchor = 6;
}

message SchemaFieldRemoveMutation {
  string schema_id = 2;
  string field_definition_id = 3;
  string field_node_id = 4;
  string field_occurrence_id = 5;
  optional SequenceAnchor previous_anchor = 6;
}

message SchemaFieldConfigureMutation {
  string schema_id = 2;
  string field_definition_id = 3;
  string field_node_id = 4;
  FieldTemplateConfig config = 5;
}

message SchemaExtensionAddMutation { string schema_id = 2; string base_schema_id = 3; SequenceAnchor anchor = 4; }
message SchemaExtensionRemoveMutation { string schema_id = 2; string base_schema_id = 3; optional SequenceAnchor previous_anchor = 4; }

message SchemaTemplateNodeAddMutation {
  string schema_id = 2;
  string template_node_id = 3;
  string template_occurrence_id = 4;
  SequenceAnchor anchor = 5;
}

message SchemaTemplateNodeRemoveMutation {
  string schema_id = 2;
  string template_node_id = 3;
  string template_occurrence_id = 4;
  optional SequenceAnchor previous_anchor = 5;
}

message TemplateNodeDetachMutation {
  string owner_node_id = 2;
  string template_node_id = 3;
  string instance_node_id = 4;
  string instance_occurrence_id = 5;
  SequenceAnchor anchor = 6;
  repeated string source_schema_ids = 7;
  repeated string source_application_schema_ids = 8;
  repeated string source_template_occurrence_ids = 9;
}

message FieldMaterializeMutation {
  string owner_node_id = 2;
  string field_definition_id = 3;
  string field_node_id = 4;
  string field_occurrence_id = 5;
}

message FieldValueDeleteMutation {
  string owner_node_id = 2;
  string field_definition_id = 3;
  string value_occurrence_id = 4;
  optional string previous_parent_node_id = 5;
  optional SequenceAnchor previous_anchor = 6;
}

message MaterializedFieldDeleteMutation {
  string owner_node_id = 2;
  string field_definition_id = 3;
  string field_node_id = 4;
  string field_occurrence_id = 5;
  optional string previous_parent_node_id = 6;
  optional SequenceAnchor previous_anchor = 7;
}

message TextSpliceMutation {
  string node_id = 2;
  repeated string delete_atom_ids = 3;
  SequenceAnchor anchor = 4;
  string insert = 5;
  map<string, google.protobuf.Value> attributes = 6;
}

message TextMarkMutation {
  string node_id = 2;
  repeated string atom_ids = 3;
  string key = 4;
  PreviousValue value = 5;
}

message ValueSetMutation {
  ValueTarget target = 2;
  ValueNamespace namespace = 3;
  string key = 4;
  google.protobuf.Value value = 5;
}

message ValueUnsetMutation {
  ValueTarget target = 2;
  ValueNamespace namespace = 3;
  string key = 4;
}

message EditMutation {
  oneof mutation {
    NodeCreateMutation node_create = 1;
    ReferencePromoteMutation reference_promote = 2;
    NodeDeleteMutation node_delete = 3;
    NodeRestoreMutation node_restore = 4;
    OccurrenceCreateMutation occurrence_create = 5;
    OccurrenceDeleteMutation occurrence_delete = 6;
    OccurrenceRestoreMutation occurrence_restore = 7;
    OccurrenceMoveMutation occurrence_move = 8;
    NodeTypeDeclareMutation node_type_declare = 9;
    SchemaApplyMutation schema_apply = 10;
    SchemaRemoveMutation schema_remove = 11;
    SchemaFieldAddMutation schema_field_add = 12;
    SchemaFieldRemoveMutation schema_field_remove = 13;
    SchemaFieldConfigureMutation schema_field_configure = 14;
    SchemaExtensionAddMutation schema_extension_add = 15;
    SchemaExtensionRemoveMutation schema_extension_remove = 16;
    SchemaTemplateNodeAddMutation schema_template_node_add = 17;
    SchemaTemplateNodeRemoveMutation schema_template_node_remove = 18;
    TemplateNodeDetachMutation template_node_detach = 19;
    FieldMaterializeMutation field_materialize = 20;
    FieldValueDeleteMutation field_value_delete = 21;
    MaterializedFieldDeleteMutation materialized_field_delete = 22;
    TextSpliceMutation text_splice = 23;
    TextMarkMutation text_mark = 24;
    ValueSetMutation value_set = 25;
    ValueUnsetMutation value_unset = 26;
  }
}
