syntax = "proto3";

package lode;

import "lode/commands.proto";

// Server-streamed notifications pushed by the engine to subscribed clients,
// delivered over the ListenNotifications RPC.

message ListenNotificationsRequest {} // session is established via the connection context

message Notification {
  string workspace_id = 1;
  string doc_id = 2;
  Origin origin = 3;
  repeated NodeUpdatedPayload payloads = 4;
}

// One semantic change to a node/occurrence. Mirrors the node/updated payload union.
message NodeUpdatedPayload {
  oneof variant {
    EntityAdded entity_added = 1;
    EntityDeleted entity_deleted = 2;
    EntityUpdated entity_updated = 3;
    OccurrenceUpdated occurrence_updated = 4;
    OccurrenceAdded occurrence_added = 5;
    OccurrenceMoved occurrence_moved = 6;
    OccurrenceDeleted occurrence_deleted = 7;
    CanonicalChanged canonical_changed = 8;
  }
}

message EntityAdded {
  string node_id = 1;
  string occurrence_id = 2;
}

message EntityDeleted {
  string node_id = 1;
}

message EntityUpdated {
  string node_id = 1;
  EntityUpdatedField field = 2;
  optional string key = 3;
}

// occurrence_updated.field is always "props", so it is implicit and omitted.
message OccurrenceUpdated {
  string occurrence_id = 1;
  string node_id = 2;
  optional string key = 3;
}

message OccurrenceAdded {
  string occurrence_id = 1;
  string node_id = 2;
  optional string parent_occurrence_id = 3;
}

message OccurrenceMoved {
  string occurrence_id = 1;
  string node_id = 2;
  optional string parent_occurrence_id = 3;
}

message OccurrenceDeleted {
  string occurrence_id = 1;
  string node_id = 2;
  optional string parent_occurrence_id = 3;
}

message CanonicalChanged {
  string node_id = 1;
  string occurrence_id = 2;
}

enum EntityUpdatedField {
  TEXT = 0;
  PROPS = 1;
}
