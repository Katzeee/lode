syntax = "proto3";

package lode;

// The broker routing frame exchanged between a BrokerClient and the relay (BrokerServer) — design
// sync-design.md §3. The relay is content-blind: `payload` (on publish/deliver) is forwarded opaque
// (a sealed sync message or a raw sync message), never decoded. Each variant carries its own fields;
// the oneof `kind` discriminates them. (Replaces an earlier hand-rolled binary codec.)

message BrokerSubscribe { string ws_id = 1; }
message BrokerUnsubscribe { string ws_id = 1; }
message BrokerPublish { string ws_id = 1; bytes payload = 2; }
message BrokerDeliver { string ws_id = 1; bytes payload = 2; }

message BrokerFrame {
  oneof kind {
    BrokerSubscribe subscribe = 1;
    BrokerUnsubscribe unsubscribe = 2;
    BrokerPublish publish = 3;
    BrokerDeliver deliver = 4;
  }
}
