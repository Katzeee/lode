syntax = "proto3";

package lode;

// The broker routing frame exchanged between a BrokerClient and the relay (BrokerServer) — design
// sync-design.md §3. The relay is content-blind: `payload` (on publish/deliver) is forwarded opaque
// (a sealed sync message or a raw sync message), never decoded. Each variant carries its own fields;
// the oneof `kind` discriminates them. (Replaces an earlier hand-rolled binary codec.)
//
// Directed routing (§3c): a client declares its per-dataRoot `peer_id` when subscribing, and may set
// `to_peer_id` on a publish to target one peer. `peers_req`/`peers_resp` lets a client ask the relay
// "who is on this channel?" — answered from its in-memory route table. peer_id is a routing hint only
// (the relay is no-auth; trust comes from the seal on the content, never from peer_id).

message BrokerSubscribe { string ws_id = 1; string peer_id = 2; }
message BrokerUnsubscribe { string ws_id = 1; }
message BrokerPublish { string ws_id = 1; bytes payload = 2; string to_peer_id = 3; }
message BrokerDeliver { string ws_id = 1; bytes payload = 2; }
message BrokerPeersReq { string ws_id = 1; }
message BrokerPeersResp { string ws_id = 1; repeated string peer_ids = 2; }

message BrokerFrame {
  oneof kind {
    BrokerSubscribe subscribe = 1;
    BrokerUnsubscribe unsubscribe = 2;
    BrokerPublish publish = 3;
    BrokerDeliver deliver = 4;
    BrokerPeersReq peers_req = 5;
    BrokerPeersResp peers_resp = 6;
  }
}
